<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>joelGPT training</title>
    <style>
      :root {
        --page: #fafaf9;
        --ink: #1c1c1a;
        --ink-2: #5c5b57;
        --muted: #8f8e89;
        --line: #dedcd6;
        --soft: #f0efeb;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--page);
        border-bottom: 1px solid var(--line);
        padding: 10px 24px;
        display: flex;
        gap: 32px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 15px;
        margin: 0;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      h3 {
        font-size: 12px;
        font-weight: normal;
        margin: 12px 0 4px;
        color: var(--ink-2);
        font-family: var(--mono);
      }
      .stat {
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        color: var(--muted);
        margin-right: 6px;
      }
      #status {
        color: var(--muted);
      }
      #status.error {
        color: #a33;
      }
      main {
        padding: 16px 24px;
        max-width: 1400px;
        margin: 0 auto;
      }
      section {
        border-top: 1px solid var(--line);
        padding: 16px 0;
      }
      .flow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 6px;
      }
      .arrow {
        align-self: center;
        color: var(--muted);
      }
      .box {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 4px;
        padding: 5px 8px;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        white-space: nowrap;
      }
      .box:hover {
        border-color: var(--muted);
      }
      .box.on {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--page);
      }
      .box.back {
        border-style: dashed;
      }
      .block {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        background: var(--soft);
      }
      .block-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-2);
        padding-right: 4px;
      }
      select {
        font: 12px var(--mono);
      }
      .detail {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 24px;
      }
      pre {
        font: 12px/1.45 var(--mono);
        background: var(--soft);
        border-radius: 4px;
        padding: 10px;
        overflow-x: auto;
        margin: 0 0 8px;
      }
      .note {
        color: var(--ink-2);
        margin: 0 0 4px;
      }
      .maps {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        border: 1px solid var(--line);
      }
      .chars {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        font: 12px var(--mono);
      }
      .chars span {
        width: 16px;
        text-align: center;
        background: var(--soft);
      }
      table {
        border-collapse: collapse;
        font: 12px var(--mono);
      }
      td,
      th {
        padding: 1px 10px 1px 0;
        text-align: left;
        border-bottom: 1px solid var(--soft);
      }
      th {
        color: var(--muted);
        font-weight: normal;
      }
      .hbar {
        display: grid;
        grid-template-columns: 120px 1fr 60px;
        gap: 8px;
        align-items: center;
        font: 12px var(--mono);
      }
      .hbar div {
        height: 6px;
        background: var(--ink-2);
      }
      .bottom {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .legend {
        font: 12px var(--mono);
        color: var(--ink-2);
        display: flex;
        gap: 16px;
      }
      .generated {
        font: 13px var(--mono);
        white-space: pre-wrap;
      }
      #tip {
        position: fixed;
        pointer-events: none;
        background: var(--ink);
        color: var(--page);
        font: 11px var(--mono);
        padding: 2px 6px;
        display: none;
        z-index: 10;
      }
      .story {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px 32px;
      }
      .story > p {
        grid-column: 1 / -1;
        max-width: 80ch;
        margin: 0;
      }
      .card h3 {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        margin: 0 0 4px;
      }
      .guess {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        font: 13px var(--mono);
      }
      .guess span {
        width: 17px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .guess span.on {
        border-color: var(--ink);
        font-weight: 700;
      }
      .meter {
        height: 10px;
        background: var(--soft);
        position: relative;
        margin: 6px 0;
      }
      .meter div {
        height: 100%;
        background: #2a5a96;
      }
      .timeline div {
        font: 12px var(--mono);
        white-space: pre-wrap;
        border-bottom: 1px solid var(--soft);
        padding: 3px 0;
      }
      .timeline b {
        color: var(--muted);
        font-weight: normal;
        margin-right: 8px;
      }
      .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 4px;
      }
      .explain {
        display: grid;
        grid-template-columns: max-content minmax(0, 80ch);
        gap: 6px 12px;
        margin: 0 0 12px;
        padding: 10px 12px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .explain b {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .explain p {
        margin: 0;
      }
      table.formula {
        font: 12px system-ui, sans-serif;
        width: 100%;
        margin-bottom: 8px;
      }
      table.formula td {
        vertical-align: top;
        padding: 4px 12px 4px 0;
        border-bottom: 1px solid var(--line);
      }
      table.formula td.math {
        font: 12px var(--mono);
        white-space: nowrap;
      }
      table.formula code {
        display: block;
        font: 12px var(--mono);
        background: var(--soft);
        padding: 1px 4px;
        white-space: pre-wrap;
      }
      table.formula .line {
        font: 10px var(--mono);
        color: var(--muted);
      }
      table.formula .missing {
        color: #a33;
        font-family: var(--mono);
      }
      .muted-cell {
        color: var(--muted);
      }
      dl.terms {
        display: grid;
        grid-template-columns: max-content minmax(0, 72ch);
        gap: 4px 12px;
        margin: 0 0 8px;
      }
      dl.terms dt {
        font-weight: 600;
      }
      dl.terms dd {
        margin: 0;
        color: var(--ink-2);
      }
      pre .hl {
        background: #fff1b8;
      }
      pre .ln {
        color: var(--muted);
        margin-right: 10px;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>joelGPT training</h1>
      <div class="stat"><span>step</span><b id="step">-</b></div>
      <div class="stat"><span>train loss</span><b id="train-loss">-</b></div>
      <div class="stat"><span>validation loss</span><b id="val-loss">-</b></div>
      <div id="status">connecting</div>
    </header>
    <main>
      <section class="story arrays" id="story"></section>
      <section class="arrays">
        <h2>The details: model flow</h2>
        <p class="note">
          Click a step to see its arrays and code. All arrays come from one
          fixed sample and update every 100 training steps.
        </p>
        <div class="flow" id="flow"></div>
      </section>
      <section class="detail arrays">
        <div id="detail"></div>
        <div id="code"></div>
      </section>
      <section class="bottom">
        <div>
          <h2>Loss</h2>
          <div class="legend">
            <span>━ train</span
            ><span style="color: var(--muted)">━ validation</span
            ><span>┄ random guess</span>
          </div>
          <svg id="chart" width="100%" height="200"></svg>
        </div>
        <div>
          <h2>Sample text</h2>
          <div class="generated" id="generated"></div>
        </div>
      </section>
    </main>
    <div id="tip"></div>
    <script>
      const state = {
        setup: null,
        progress: null,
        view: null,
        stage: "attention",
        layer: 0,
        head: 0,
        shownStep: null,
        pick: null,
      };
      const VOWELS = new Set("aeiouAEIOU");
      const GROUPS = [
        { name: "vowels", color: "#2a78d6", test: (c) => VOWELS.has(c) },
        { name: "small consonants", color: "#eb6834", test: (c) => /[a-z]/.test(c) },
        { name: "capitals", color: "#1baf7a", test: (c) => /[A-Z]/.test(c) },
        { name: "space, digits, punctuation", color: "#8f8e89", test: () => true },
      ];

      const STAGES = [
        { id: "batch", label: "get_batch", fn: ["get_batch"] },
        { id: "embed", label: "embed", fn: ["embed"] },
        {
          block: [
            {
              id: "ln1",
              label: "layer_norm",
              fn: ["layer_norm", "transformer_block"],
            },
            { id: "attention", label: "attention", fn: ["attention"] },
            {
              id: "combine",
              label: "multi_head_attention",
              fn: ["multi_head_attention", "transformer_block"],
            },
            {
              id: "ln2",
              label: "layer_norm",
              fn: ["layer_norm", "transformer_block"],
            },
            { id: "feed_forward", label: "feed_forward", fn: ["feed_forward"] },
            { id: "residual", label: "+ residual", fn: ["transformer_block"] },
          ],
        },
        { id: "final", label: "layer_norm", fn: ["predict"] },
        { id: "lens", label: "guess per block", fn: ["predict"] },
        { id: "predict", label: "softmax", fn: ["predict"] },
        { id: "loss", label: "loss", fn: ["forward_pass"] },
        {
          id: "backward",
          label: "backward_pass",
          fn: ["backward_pass"],
          back: true,
        },
        {
          id: "adam",
          label: "adam_optimizer",
          fn: ["adam_optimizer"],
          back: true,
        },
      ];

      const el = (tag, attrs = {}, ...children) => {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs)) {
          if (key === "onclick" || key === "onchange") node[key] = value;
          else node.setAttribute(key, value);
        }
        node.append(...children);
        return node;
      };
      const fmt = (value) =>
        Math.abs(value) >= 100 ? value.toFixed(0) : value.toPrecision(3);

      function colorFor(value, max, positive) {
        const t = Math.min(1, Math.abs(value) / (max || 1));
        const mix = (r, g, b) =>
          `rgb(${255 - (255 - r) * t},${255 - (255 - g) * t},${255 - (255 - b) * t})`;
        if (positive) return mix(40, 40, 38);
        return value >= 0 ? mix(150, 70, 50) : mix(50, 80, 120);
      }

      function heatmap(
        title,
        matrix,
        { positive = false, colLabels = null } = {},
      ) {
        const rows = matrix.length;
        const cols = matrix[0].length;
        const cell = Math.max(1, Math.min(8, Math.floor(520 / cols)));
        const rowHeight = Math.max(4, Math.min(8, Math.floor(400 / rows)));
        const canvas = el("canvas", {
          width: cols * cell,
          height: rows * rowHeight,
        });
        const context = canvas.getContext("2d");
        const max = Math.max(...matrix.flat().map(Math.abs));
        matrix.forEach((row, i) =>
          row.forEach((value, j) => {
            context.fillStyle = colorFor(value, max, positive);
            context.fillRect(j * cell, i * rowHeight, cell, rowHeight);
          }),
        );
        const tip = document.getElementById("tip");
        canvas.onmousemove = (event) => {
          const i = Math.floor(event.offsetY / rowHeight);
          const j = Math.floor(event.offsetX / cell);
          if (i >= rows || j >= cols) return;
          const column = colLabels ? `'${colLabels[j]}'` : `col ${j}`;
          tip.textContent = `pos ${i} '${state.view.x[i]}', ${column}: ${fmt(matrix[i][j])}`;
          tip.style.display = "block";
          tip.style.left = event.clientX + 12 + "px";
          tip.style.top = event.clientY + 12 + "px";
        };
        canvas.onmouseleave = () => (tip.style.display = "none");
        return el(
          "div",
          {},
          el("h3", {}, `${title}  (${rows}, ${cols})`),
          canvas,
        );
      }

      function chars(title, list) {
        return el(
          "div",
          {},
          el("h3", {}, title),
          el("div", { class: "chars" }, ...list.map((c) => el("span", {}, c))),
        );
      }

      function bars(names, values) {
        const max = Math.max(...values) || 1;
        return el(
          "div",
          {},
          ...names.map((name, i) =>
            el(
              "div",
              { class: "hbar" },
              name,
              el("div", { style: `width: ${(100 * values[i]) / max}%` }),
              fmt(values[i]),
            ),
          ),
        );
      }

      const NS = "http://www.w3.org/2000/svg";
      const svgEl = (tag, attrs = {}, text = "") => {
        const node = document.createElementNS(NS, tag);
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
        node.textContent = text;
        return node;
      };
      const sure = (p) => {
        const t = Math.sqrt(Math.min(1, p));
        return `rgb(${240 - 198 * t},${239 - 149 * t},${235 - 85 * t})`;
      };
      const ink = (p) => (p > 0.35 ? "#fafaf9" : "#1c1c1a");
      const percent = (p) => `${(p * 100).toFixed(p < 0.1 ? 1 : 0)}%`;
      const headMean = (heads) =>
        heads[0].map((row, i) =>
          row.map((_, j) => heads.reduce((sum, head) => sum + head[i][j], 0) / heads.length),
        );

      function arcs(letters, weights, pick, color) {
        const cell = 10;
        const height = 130;
        const base = height - 22;
        const svg = svgEl("svg", { width: letters.length * cell, height });
        const middle = (j) => j * cell + cell / 2;
        const strongest = Math.max(...weights[pick].slice(0, pick + 1));
        weights[pick].forEach((w, j) => {
          if (j > pick || w < strongest * 0.15) return;
          const lift = Math.min(10 + (pick - j) * 2, base - 4);
          svg.append(
            svgEl("path", {
              d: `M${middle(pick)},${base} Q${(middle(pick) + middle(j)) / 2},${base - lift} ${middle(j)},${base}`,
              fill: "none",
              stroke: color,
              "stroke-width": (0.5 + (w / strongest) * 5).toFixed(2),
              "stroke-opacity": (0.25 + (0.75 * w) / strongest).toFixed(2),
              "stroke-linecap": "round",
            }),
          );
        });
        letters.forEach((c, j) => {
          const label = svgEl(
            "text",
            {
              x: middle(j),
              y: height - 6,
              "text-anchor": "middle",
              "font-size": 11,
              "font-family": "ui-monospace, Menlo, monospace",
              "font-weight": j === pick ? 700 : 400,
              fill: j > pick ? "#dedcd6" : "#1c1c1a",
              style: "cursor: pointer",
            },
            c,
          );
          label.onclick = () => pickPosition(j);
          svg.append(label);
        });
        return el("div", { style: "overflow-x: auto" }, svg);
      }

      function letterMap(map) {
        const size = 300;
        const pad = 16;
        const xs = map.points.map((p) => p[0]);
        const ys = map.points.map((p) => p[1]);
        const scale = (values) => {
          const low = Math.min(...values);
          const span = Math.max(...values) - low || 1;
          return (value) => pad + ((value - low) / span) * (size - 2 * pad);
        };
        const sx = scale(xs);
        const sy = scale(ys);
        const svg = svgEl("svg", { width: size, height: size, style: "border: 1px solid #dedcd6; background: #fff" });
        map.chars.forEach((c, i) => {
          const group = GROUPS.find((g) => g.test(c));
          svg.append(
            svgEl(
              "text",
              {
                x: sx(xs[i]),
                y: size - sy(ys[i]),
                "text-anchor": "middle",
                "dominant-baseline": "middle",
                "font-size": 13,
                "font-family": "ui-monospace, Menlo, monospace",
                fill: group.color,
                "font-weight": 600,
              },
              c,
            ),
          );
        });
        return el(
          "div",
          {},
          svg,
          el(
            "div",
            { class: "legend", style: "flex-wrap: wrap; margin-top: 4px" },
            ...GROUPS.map((g) =>
              el("span", {}, el("i", { class: "swatch", style: `background: ${g.color}` }), g.name),
            ),
          ),
        );
      }

      function guessStrip(v) {
        return el(
          "div",
          { class: "guess" },
          el("span", { style: "color: var(--muted)" }, v.x[0]),
          ...v.y.map((c, i) =>
            el(
              "span",
              {
                class: i === state.pick ? "on" : "",
                style: `background: ${sure(v.correct_probability[i])}; color: ${ink(v.correct_probability[i])}`,
                onclick: () => pickPosition(i),
              },
              c,
            ),
          ),
        );
      }

      function renderStory() {
        const v = state.view;
        const c = state.setup.config;
        const i = state.pick;
        const knobs = state.setup.parameter_shapes.reduce((sum, shape) => sum + shape.reduce((a, b) => a * b, 1), 0);
        const choices = Math.exp(v.loss);
        const card = (title, ...children) => el("div", { class: "card" }, el("h3", {}, title), ...children);
        const note = (text) => el("p", { class: "note" }, text);
        const guesses = v.top_chars[i].map((g, k) => `'${g}' ${percent(v.top_probabilities[i][k])}`).join(",  ");
        const context = v.x.slice(Math.max(0, i - 24), i + 1).join("");
        document.getElementById("story").replaceChildren(
          el("h2", { style: "grid-column: 1 / -1; margin: 0" }, "What is happening, in simple words"),
          el(
            "p",
            {},
            `The model plays one game, over and over: read a bit of a story and guess the next letter. At the start it knows nothing, so it guesses at random. After every guess it checks the real next letter, and it turns its ${knobs.toLocaleString()} number knobs a tiny bit so the right letter gets a higher chance next time. That is training. This page shows the game on one fixed piece of text and updates every 100 training steps.`,
          ),
          card(
            "1. The guessing game",
            note("Each letter below is one guess. Dark blue: the model expected that letter. Pale: it was surprised. Click a letter."),
            guessStrip(v),
            note(`After reading "…${context}", the model guesses: ${guesses}. The real next letter is '${v.y[i]}' (it gave it ${percent(v.correct_probability[i])}).`),
          ),
          card(
            "2. Score: how unsure is it?",
            note(`There are ${c.vocab_size} different letters and signs. Right now the model is as unsure as if it picked between about ${choices < 10 ? choices.toFixed(1) : Math.round(choices)} of them. Lower is better. Random guessing is ${c.vocab_size}.`),
            el("div", { class: "meter" }, el("div", { style: `width: ${Math.min(100, (100 * choices) / c.vocab_size)}%` })),
            note(`Scientists call the log of this number the loss: ln(${choices.toFixed(1)}) = ${fmt(v.loss)}. The loss chart at the bottom shows it falling.`),
          ),
          card(
            "3. What it writes, checkpoint by checkpoint",
            note("Each line starts with \"" + state.setup.prompt + "\" and the model adds 200 letters, one guess at a time. Watch random letters turn into spaces, then short words."),
            el(
              "div",
              { class: "timeline" },
              ...v.timeline
                .slice()
                .reverse()
                .map((entry) => el("div", {}, el("b", {}, `step ${entry.step}`), entry.text.slice(state.setup.prompt.length, state.setup.prompt.length + 90).replace(/\n/g, " ⏎ "))),
            ),
          ),
          card(
            "4. Where it looks",
            note(`To guess the letter after '${v.x[i]}', the model looks back at earlier letters. A thicker line means it looks there more, compared with the other lines. Lines under 15% of the strongest one are hidden. It can never look ahead, that would be cheating. Block ${state.layer}, all ${c.n_heads} heads together.`),
            arcs(v.x, headMean(v.head_attention), i, "#2a5a96"),
          ),
          card(
            "5. The letter map",
            note(`The model stores every letter as ${c.n_embedding} numbers. This map squeezes those numbers down to 2 so we can draw them. Letters the model uses in a similar way move close together. At the start they sit at random. As it learns, look for groups: capitals, punctuation, vowels.`),
            letterMap(v.letter_map),
          ),
          card(
            "6. What it learns first",
            note("Real language models learn in the same order as this one. First: which letters are common (lots of 'e' and spaces). Then: which letter usually follows which ('q' then 'u'). Last: longer patterns, like whole words and names that appeared earlier in the story."),
            note("Below this box are the real details: every step of the model, the numbers inside it and your code."),
          ),
        );
      }

      function pickPosition(i) {
        state.pick = i;
        renderStory();
        renderDetail();
      }

      function renderFlow() {
        const flow = document.getElementById("flow");
        flow.replaceChildren();
        const box = (stage) =>
          el(
            "div",
            {
              class: `box${stage.id === state.stage ? " on" : ""}${stage.back ? " back" : ""}`,
              onclick: () => select(stage.id),
            },
            stage.label,
          );
        const picker = (count, current, name, onPick) =>
          el(
            "select",
            { onchange: (event) => onPick(+event.target.value) },
            ...Array.from({ length: count }, (_, i) =>
              el(
                "option",
                i === current ? { value: i, selected: "" } : { value: i },
                `${name} ${i}`,
              ),
            ),
          );
        const { n_layers, n_heads } = state.setup.config;
        STAGES.forEach((stage, index) => {
          if (index > 0) flow.append(el("span", { class: "arrow" }, "→"));
          if (!stage.block) return flow.append(box(stage));
          const inner = stage.block.flatMap((child, i) =>
            i > 0
              ? [el("span", { class: "arrow" }, "→"), box(child)]
              : [box(child)],
          );
          flow.append(
            el(
              "div",
              { class: "block" },
              el(
                "div",
                { class: "block-label" },
                `transformer_block × ${n_layers}`,
                picker(n_layers, state.layer, "layer", (value) => {
                  state.layer = value;
                  loadView();
                }),

        });
      }

      function findStage(id) {
        return STAGES.flatMap((stage) => stage.block || [stage]).find(
          (stage) => stage.id === id,
        );
      }

      function explainer(v, c) {
        const p = state.pick;
        const quote = (text) => `"${text}"`;
        const context = v.x.slice(Math.max(0, p - 12), p + 1).join("");
        const rows = c.batch_size * c.block_size;
        const knobs = state.setup.parameter_shapes.reduce((sum, shape) => sum + shape.reduce((a, b) => a * b, 1), 0);
        const lookedAt = v.head_attention[state.head][p]
          .map((w, j) => ({ w, j }))
          .slice(0, p + 1)
          .sort((a, b) => b.w - a.w)
          .slice(0, 3)
          .map(({ w, j }) => `'${v.x[j]}' at position ${j} (${percent(w)})`)
          .join(", ");
        const active = v.hidden[p].filter((value) => value > 0).length;
        const width = 4 * c.n_embedding;
        const guesses = v.top_chars[p].map((g, k) => `'${g}' ${percent(v.top_probabilities[p][k])}`).join(", ");
        const correct = v.correct_probability[p];
        const lensPath = v.lens.map((row, k) => `${k === 0 ? "embedding" : `block ${k - 1}`}: '${row.top[p]}'`).join(", ");
        return {
          batch: [
            `The model gets a piece of real text, ${c.block_size} letters long, and the same text shifted by one letter. For every letter in x, the letter below it in y is the answer it must guess. So one piece of text is ${c.block_size} guessing questions at once.`,
            `get_batch picks ${c.batch_size} random start positions i and cuts x = data[i : i+${c.block_size}] and y = data[i+1 : i+${c.block_size + 1}], both shape (${c.batch_size}, ${c.block_size}) of char ids. Position t must predict y[t] using only x[0..t]. One training step trains on ${c.batch_size} × ${c.block_size} = ${rows} predictions. This page uses one fixed sequence from the validation data (batch of 1), so checkpoints stay comparable.`,
          ],
          embed: [
            `A computer cannot calculate with letters, so each letter is swapped for its list of ${c.n_embedding} numbers from a table. A second table adds a list that says where in the text the letter sits. Training changes the numbers in both tables.`,
            `token_table has shape (${c.vocab_size}, ${c.n_embedding}), one learned row per char. position_table has shape (${c.block_size}, ${c.n_embedding}), one learned row per position. embed returns token_table[x] + position_table[0..T-1], shape (1, ${c.block_size}, ${c.n_embedding}). Without the position rows, attention could not tell word order, because a dot product does not know where a vector came from. Only the token rows of chars that appear in a batch get a gradient in that step.`,
          ],
          ln1: [
            "Before the block works with a letter's numbers, it rescales them so they are not too big or too small. That keeps the math in the same range, however much earlier blocks have added.",
            `layer_norm works on each row (one position) alone: subtract the row mean, divide by sqrt(variance + 1e-5), then multiply by gamma1[${state.layer}] and add beta1[${state.layer}]. Both have shape (${c.n_embedding},), are learned, and start at 1 and 0. This is pre-norm: the normalized copy goes into attention, but the residual add later uses the original x.`,
          ],
          attention: [
            `This is the only step where letters share information. Each letter sends out a question, and every earlier letter shows a label. Where question and label match, the letter copies information from there. Right now, in head ${state.head} of block ${state.layer}, '${v.x[p]}' at position ${p} looks most at ${lookedAt}. A letter can only look back, never ahead, because the letters ahead are the answers.`,
            `Per position the head computes three vectors of ${c.head_size} numbers: query = x @ query_weights[${state.layer}, ${state.head}] (what it looks for), key = x @ key_weights (what it can be found by), value = x @ value_weights (what it passes on). scores = query @ keyᵀ / sqrt(${c.head_size}) has shape (${c.block_size}, ${c.block_size}). Entry (t, j) measures how well position t's query matches position j's key. Dividing by sqrt(head_size) keeps scores small, so softmax does not lock onto one position early in training. The causal mask sets scores with j > t to -inf, which become exactly 0 after softmax. softmax turns each row into weights ≥ 0 that sum to 1. The head output at t is the weighted average of the value vectors: weights @ value, shape (${c.block_size}, ${c.head_size}). The ${c.n_heads} heads have separate weights, so each can learn its own pattern, for example "the previous letter" or "the start of this word".`,
          ],
          combine: [
            `Each of the ${c.n_heads} heads found something different. The model puts their results side by side, mixes them into one list of ${c.n_embedding} numbers, and adds that to the letter's list. It adds instead of replacing, so nothing the letter knew before is lost.`,
            `multi_head_attention concatenates the ${c.n_heads} head outputs to shape (${c.block_size}, ${c.n_heads} × ${c.head_size} = ${c.n_embedding}) and multiplies by output_weights[${state.layer}] (${c.n_embedding} × ${c.n_embedding}), which lets heads combine. transformer_block then computes mid = x + attention_out. Because of this residual connection a block only writes a change on top of its input. In backprop the + passes the gradient on unchanged, so it reaches the early blocks without shrinking through every matrix.`,
          ],
          ln2: [
            "The same rescaling as before, now on the result after attention, just before the feed forward step.",
            `layer_norm(mid, gamma2[${state.layer}], beta2[${state.layer}]), the same formula as layer norm 1 with its own learned gamma and beta.`,
          ],
          feed_forward: [
            `Now every letter works alone, without looking at others. Its ${c.n_embedding} numbers feed ${width} small detectors. Each detector either switches on for this letter in this context or stays at 0. The detectors that are on write a change back into the letter's list. At position ${p}, ${active} of ${width} are on. Attention collected information from other letters. This step processes it.`,
            `hidden = x @ W1[${state.layer}] + b1[${state.layer}] widens each row from ${c.n_embedding} to ${width}. relu = max(0, hidden) sets negatives to 0, so each of the ${width} columns is a unit that is active or not. out = relu @ W2[${state.layer}] + b2[${state.layer}] maps back to ${c.n_embedding}. The same weights apply at every position. relu makes the block nonlinear: without it, W1 and W2 would collapse into one matrix. An inactive unit passes no gradient back, so it does not learn from that position in that step.`,
          ],
          residual: [
            `The feed forward result is added to the letter's list too. The finished list goes into the next block, which repeats every step with its own weights. There are ${c.n_layers} blocks.`,
            `layer_out = mid + feed_forward_out. The output of block l is the input of block l + 1. So each position's vector is a running sum: the embedding plus every change that attention and feed forward wrote in every block. This sum is called the residual stream.`,
          ],
          final: [
            "After the last block comes one more rescaling, then the numbers are ready to turn into a guess.",
            `layer_norm(block_out, gamma_final, beta_final), shape (${c.block_size}, ${c.n_embedding}). "guess per block" applies this same norm early to the output of each block.`,

          lens: [
            `We can stop the model early and force it to guess. For the letter after ${quote(context)}, the guesses are ${lensPath}. The real answer is '${v.y[p]}'. This shows in which block the model figures out the answer.`,
            "Logit lens: apply layer_norm(·, gamma_final, beta_final) @ vocab_weights and softmax to the residual stream after the embedding and after each block. It is a read-out only and plays no part in training. The intermediate streams were never trained to be read this way, so early rows are a rough view. The last row is the real prediction.",

function findLine(fn, find) {
  const lines = state.setup.source[fn].split("\n");
  const index = lines.findIndex((line) => line.includes(find));
  if (index < 0) return null;
  return {
    number: state.setup.source_lines[fn] + index,
    text: lines[index].trim(),
  };
}

function formulaTable(rows) {
  return el(
    "table",
    { class: "formula" },
    el(
      "tr",
      {},
      ...["math", "your code", "what it means"].map((h) => el("th", {}, h)),
    ),
    ...rows.map((r) => {
      const line = r.fn ? findLine(r.fn, r.find) : null;
      const code = !r.fn
        ? el("td", { class: "muted-cell" }, `not in ${state.setup.file}`)
        : line
          ? el(
              "td",
              {},
              el("span", { class: "line" }, `${r.fn} · ${state.setup.file}:${line.number}`),
              el("code", {}, line.text),
            )
          : el("td", { class: "missing" }, `"${r.find}" not found in ${r.fn}`);
      return el(
        "tr",
        {},
        el("td", { class: "math" }, r.math),
        code,
        el("td", {}, r.why),
      );
    }),
  );
}

function attentionExample(v, c) {
  const p = state.pick;
  const head = state.head;
  const q = v.query[p];
  const dot = (a, b) => a.reduce((sum, value, k) => sum + value * b[k], 0);
  const scores = v.key
    .slice(0, p + 1)
    .map((k) => dot(q, k) / Math.sqrt(c.head_size));
  const peak = Math.max(...scores);
  const total = scores.reduce((sum, s) => sum + Math.exp(s - peak), 0);
  const j = v.head_attention[head][p]
    .slice(0, p + 1)
    .reduce((best, w, k, row) => (w > row[best] ? k : best), 0);
  const raw = dot(q, v.key[j]);
  const products = q
    .slice(0, 3)
    .map((value, k) => `${fmt(value)}·${fmt(v.key[j][k])}`)
    .join(" + ");
  return el(
    "pre",
    {},
    `Worked example: head ${head}, query at position ${p} '${v.x[p]}', key at position ${j} '${v.x[j]}' (its strongest match)\n` +
      `q · k   = ${products} + … (${c.head_size} products) = ${fmt(raw)}\n` +
      `score   = ${fmt(raw)} / sqrt(${c.head_size}) = ${fmt(raw / Math.sqrt(c.head_size))}\n` +
      `weight  = e^(score − max) / Σ e^(scores − max) over ${p + 1} visible positions = ${fmt(Math.exp(scores[j] - peak) / total)}\n` +
      `model   = ${fmt(v.head_attention[head][p][j])}  (weights[${p}, ${j}] from your forward pass)`,
  );
}

function stepSections(v, c) {
  const steps = STEPS[state.stage];
  const parts = [];
  if (steps.terms) {
    parts.push(
      el("h3", {}, "Words"),
      el(
        "dl",
        { class: "terms" },
        ...steps.terms.flatMap(([word, text]) => [
          el("dt", {}, word),
          el("dd", {}, text(c)),
        ]),
      ),
    );
  }
  if (state.stage === "attention") parts.push(attentionExample(v, c));
  if (steps.forward.length)
    parts.push(
      el("h3", {}, "Forward: formula → your code"),
      formulaTable(steps.forward),
    );
  parts.push(
    el("h3", {}, "Backward: what flows back through this step"),
    el("p", { class: "note" }, steps.backward.text),
  );
  if (steps.backward.rows.length) parts.push(formulaTable(steps.backward.rows));
  return parts;
}

function codePanel(stage) {
  const steps = STEPS[stage.id];
  const rows = [...steps.forward, ...steps.backward.rows].filter((r) => r.fn);
  const names = [...new Set([...stage.fn, ...rows.map((r) => r.fn)])];
  const marked = new Set(
    rows
      .map((r) => findLine(r.fn, r.find))
      .filter(Boolean)
      .map((line) => line.number),
  );
  return names.map((name) => {
    const start = state.setup.source_lines[name];
    return el(
      "pre",
      {},
      ...state.setup.source[name]
        .split("\n")
        .map((text, k) =>
          el(
            "div",
            { class: marked.has(start + k) ? "hl" : "" },
            el("span", { class: "ln" }, String(start + k).padStart(3)),
            text,
          ),
        ),
    );
  });
}

      function renderDetail() {
        const v = state.view;
        const c = state.setup.config;
        const where = `Layer ${state.layer}.`;
        const note = (text) => el("p", { class: "note" }, text);
        const maps = (...items) => el("div", { class: "maps" }, ...items);
        const body = {
          batch: () => [
            note(
              `x is ${c.block_size} chars from validation data. y is x shifted by one.`,
            ),
            chars("x", v.x),
            chars("y", v.y),
          ],
          embed: () => [
            note(
              "One token_table row per char plus one position_table row per position.",
            ),
            maps(
              heatmap("token_table[x]", v.token_rows),
              heatmap("position_table[positions]", v.position_rows),
              heatmap("token + position", v.embedded),
            ),
          ],
          ln1: () => [
            note(
              `${where} Each row scaled to mean 0 and spread 1, then times gamma1 plus beta1.`,
            ),
            maps(heatmap("layer_norm(x, gamma1, beta1)", v.ln1)),
          ],
          attention: () => [
            note(
              `${where} Head ${state.head}. Row i shows how much position i looks at each earlier position. Future positions are masked to 0.`,
            ),
            arcs(v.x, v.head_attention[state.head], state.pick, "#1c1c1a"),
            note(
              "Arcs show row " + state.pick + " of weights. Click a letter to change the row. Attention shows where a head reads from, not why the model made its guess.",
            ),
            maps(
              heatmap("weights", v.head_attention[state.head], {
                positive: true,
                colLabels: v.x,
              }),
              heatmap("query", v.query),
              heatmap("key", v.key),
              heatmap("value", v.value),
              heatmap("weights @ value", v.head_out),
            ),
          ],
          combine: () => [
            note(
              `${where} Heads glued side by side, mixed by output_weights, added to x.`,
            ),
            maps(
              heatmap("heads", v.heads),
              heatmap("heads @ output_weights", v.attention_out),
              heatmap("mid = x + attention_out", v.mid),
            ),
          ],
          ln2: () => [
            note(
              `${where} Same as the first layer norm, with gamma2 and beta2.`,
            ),
            maps(heatmap("layer_norm(mid, gamma2, beta2)", v.ln2)),
          ],
          feed_forward: () => [
            note(
              `${where} Widen to ${4 * c.n_embedding}, relu, shrink back to ${c.n_embedding}.`,
            ),
            maps(
              heatmap("relu(x @ W1 + b1)", v.hidden, { positive: true }),
              heatmap("relu @ W2 + b2", v.feed_forward_out),
            ),
          ],
          residual: () => [
            note(
              `${where} mid plus the feed forward output. Input of the next layer.`,
            ),
            maps(heatmap("mid + feed_forward_out", v.layer_out)),
          ],
          final: () => [
            note(`Last layer norm, after all ${c.n_layers} blocks.`),
            maps(
              heatmap(
                "layer_norm(block_out, gamma_final, beta_final)",
                v.final_norm,
              ),
            ),
          ],
          lens: () => [
            note(
              `Logit lens: after the embedding and after every block, apply the final layer_norm and vocab_weights early and read the guess. Each row shows p(y) per position. The last row is the real prediction. Rows usually get darker with depth.`,
            ),
            maps(
              heatmap(
                "p(y) if the model stopped here",
                v.lens.map((row) => row.correct),
                { positive: true, colLabels: v.y },
              ),
            ),
            el(
              "table",
              {},
              el("tr", {}, ...["stops after", `top guess at position ${state.pick}`, `p('${v.y[state.pick]}')`].map((h) => el("th", {}, h))),
              ...v.lens.map((row, k) =>
                el(
                  "tr",
                  {},
                  el("td", {}, k === 0 ? "embed" : `block ${k - 1}`),
                  el("td", {}, row.top[state.pick]),
                  el("td", {}, fmt(row.correct[state.pick])),
                ),
              ),
            ),
          ],
          predict: () => [
            note("Top 3 guesses for the next char at each position."),
            el(
              "table",
              {},
              el(
                "tr",
                {},
                ...["pos", "x", "y", "p(y)", "top 3"].map((h) =>
                  el("th", {}, h),
                ),
              ),
              ...v.x.map((ch, i) =>
                el(
                  "tr",
                  {},
                  el("td", {}, i),
                  el("td", {}, ch),
                  el("td", {}, v.y[i]),
                  el("td", {}, fmt(v.correct_probability[i])),
                  el(
                    "td",
                    {},
                    v.top_chars[i]
                      .map((g, k) => `${g} ${fmt(v.top_probabilities[i][k])}`)
                      .join("   "),
                  ),
                ),
              ),
            ),
          ],
          loss: () => [
            note(
              `mean(-log p(y)) = ${fmt(v.loss)}. Random guessing gives ln(${c.vocab_size}) = ${fmt(Math.log(c.vocab_size))}.`,
            ),
            maps(
              heatmap(
                "p(y) per position",
                v.correct_probability.map((p) => [p]),
                { positive: true },
              ),
            ),
          ],
          backward: () => [
            note("Gradient size per parameter for this sample."),
            bars(state.setup.parameter_names, v.gradient_norms),
          ],
          adam: () => [
            note(
              `Weight change since the last checkpoint. learning_rate = ${c.learning_rate}.`,
            ),
            bars(state.setup.parameter_names, v.change_norms),
            el("h3", {}, "log10(change / size of weights)"),
            note(
              `Change over the last ${v.steps_between} steps divided by the size of the weights. One Adam step usually moves weights by about 1/1000 of their size (log10 = -3). Changes over many steps partly add up, so expect values above -3. Very low: that table barely learns. Weights that start at 0 (beta, b1, b2) show high values early.`,
            ),
            el(
              "table",
              {},
              ...state.setup.parameter_names.map((name, k) => {
                const ratio = v.change_norms[k] / (v.weight_norms[k] || 1);
                return el("tr", {}, el("td", {}, name), el("td", {}, ratio > 0 ? Math.log10(ratio).toFixed(2) : "no change"));
              }),
            ),
          ],
        }[state.stage]();
        const stage = findStage(state.stage);
        document
          .getElementById("detail")
          .replaceChildren(
            el("h2", {}, stage.label),
            el(
              "div",
              { class: "explain" },
              ...explainer(v, c).flatMap((text, k) => [el("b", {}, k === 0 ? "Simple" : "Exactly"), el("p", {}, text)]),
            ),
            ...stepSections(v, c),
            el("h3", {}, "The arrays from your forward pass"),
            ...body,
          );
        document
          .getElementById("code")
          .replaceChildren(
            el("h2", {}, "Code"),
            ...codePanel(stage),
          );
      }

      function renderChart() {
        const svg = document.getElementById("chart");
        const width = svg.clientWidth;
        const height = 200;
        const { train_losses, validation_losses, max_steps } = state.progress;
        const random = Math.log(state.setup.config.vocab_size);
        const x = (step) => 24 + (step / max_steps) * (width - 32);
        const y = (loss) =>
          8 +
          (1 - Math.min(loss, random * 1.05) / (random * 1.05)) * (height - 24);
        const line = (points, color) =>
          points.length
            ? `<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${points.map(([s, l]) => `${x(s)},${y(l)}`).join(" ")}"/>`
            : "";
        const grid = [0, 1, 2, 3, 4]
          .map(
            (t) =>
              `<text x="0" y="${y(t) + 4}" font-size="10" fill="#8f8e89">${t}</text><line x1="24" x2="${width - 8}" y1="${y(t)}" y2="${y(t)}" stroke="#f0efeb"/>`,
          )
          .join("");
        const guess = `<line x1="24" x2="${width - 8}" y1="${y(random)}" y2="${y(random)}" stroke="#8f8e89" stroke-dasharray="3 3"/>`;
        svg.innerHTML =
          grid +
          guess +
          line(validation_losses, "#8f8e89") +
          line(train_losses, "#1c1c1a");
      }

      function renderHeader() {
        const p = state.progress;
        const status = document.getElementById("status");
        status.className = p.error ? "error" : "";
        status.textContent =
          p.error ||
          (p.train_losses.length ? "live" : `waiting for ${state.setup.command}`);
        document.getElementById("step").textContent =
          `${p.step} / ${p.max_steps}`;
        const last = (list) =>
          list.length ? fmt(list[list.length - 1][1]) : "-";
        document.getElementById("train-loss").textContent = last(
          p.train_losses,
        );
        document.getElementById("val-loss").textContent = last(
          p.validation_losses,
        );
      }

      function renderView() {
        const prompt = state.setup.prompt;
        document
          .getElementById("generated")
          .replaceChildren(
            el("b", {}, prompt),
            state.view.generated.slice(prompt.length),
          );
        if (state.setup.model === "ai_gpt") return;
        renderStory();
        renderDetail();
      }

      function select(id) {
        state.stage = id;
        renderFlow();
        renderDetail();
      }

      async function getJson(path) {
        const response = await fetch(path);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        return data;
      }

      async function loadView() {
        state.view = await getJson(
          `/api/view?layer=${state.layer}&head=${state.head}`,
        );
        state.shownStep = state.view.step;
        if (state.pick === null && state.view.y) state.pick = state.view.y.length - 1;
        renderView();
      }

      async function poll() {
        try {
          state.progress = await getJson("/api/progress");
          renderHeader();
          renderChart();
          if (state.progress.step !== state.shownStep) await loadView();
        } catch (error) {
          const status = document.getElementById("status");
          status.className = "error";
          status.textContent = `server not reachable: ${error.message}`;
        }
        setTimeout(poll, 2000);
      }

      async function start() {
        state.setup = await getJson("/api/setup");
        document.querySelector("h1").textContent = `${state.setup.model} training`;
        if (state.setup.model === "ai_gpt") {
          document.querySelectorAll(".arrays").forEach((section) => (section.style.display = "none"));
        } else {
          renderFlow();
        }
        poll();
      }

      start();
    </script>
  </body>
